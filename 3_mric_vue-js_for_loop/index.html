<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue-js</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<style>

    input{
        padding: 15px;
    }

    #demo{
        width: 600px;
        height: 300px;
        background-color: saddlebrown;
    }

    ul{
        list-style-type: none;
        margin: 0;
        padding: 0;
    }

    ul li{
        display: flex;
        align-items: center;
        padding-block: 9px;
        width: 60%;
        justify-content: space-between;
        background-color: #eee;
        margin: 9px;
        padding: 9px;
    }

    ul li.active{
        background-color: salmon;
        color: white;
    }

    ul li:hover{
        background-color: #ccc;
        cursor: pointer;
    }

    ul li img{
        display: block;
        width: 120px;
        height: 120px;
        object-fit: cover;
    }

</style>
<body>
    <div id="app">

        <input type="button" value="Hide/Show" @click="hideShow()"> 
        <div id="demo" v-if="isShow">

        </div>

        <ul>
            <li v-for="(item, i) in itemList">
                {{item}} - {{i}}
            </li>
        </ul>

        <ul>
            <!-- <li class= "a":class="{ 'active': data.isActive}" -->
            <li :class="{ 'active': data.isActive}"
            v-for="(data, i)  in itemObj" 
            @mouseover="newImg(i)"
            @mouseout="oldImg(i)"
            @click="clickLi(i)"
            >
                {{data.name}}
                <img :src="data.img" alt="">
            </li>
        </ul>
       
    </div>
</body>
<script src="index.js"></script>
</html>
